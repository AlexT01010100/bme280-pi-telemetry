name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver:
    name: C driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build (x86_64)
        run: make -B CFLAGS="-O2 -Wall -Wextra -Werror"
      - name: Build (aarch64 / Raspberry Pi)
        run: make -B CC=aarch64-linux-gnu-gcc CFLAGS="-O2 -Wall -Wextra -Werror"

  service:
    name: Service tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bme
          POSTGRES_PASSWORD: bme
          POSTGRES_DB: telemetry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bme -d telemetry"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements-dev.txt
      - name: Build libbme280.so (enables the ctypes binding tests)
        run: make libbme280.so
      - run: pip install -r service/requirements-dev.txt
      - name: pytest
        working-directory: service
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bme:bme@localhost:5432/telemetry
        run: pytest -v

  image:
    name: Docker image
    needs: [driver, service]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      # PRs build the image to prove it still builds for the Pi, but don't publish.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
