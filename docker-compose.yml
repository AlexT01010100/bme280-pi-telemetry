# On the Pi, using the image CI publishes:  docker compose pull && docker compose up -d
# Building locally instead:                docker compose up -d --build
# Off the Pi (no SPI/UART):                BME_DRIVER=mock BME_CO2_DRIVER=mock docker compose up -d --build
name: bme280-pi-telemetry

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bme}
      POSTGRES_DB: telemetry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bme -d telemetry"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/alext01010100/pi-air-monitor:latest
    build:
      context: .
      dockerfile: service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      BME_DATABASE_URL: postgresql+asyncpg://bme:${POSTGRES_PASSWORD:-bme}@db:5432/telemetry
      BME_DRIVER: ${BME_DRIVER:-native}
      BME_SPI_DEVICE: ${BME_SPI_DEVICE:-/dev/spidev0.0}
      BME_CO2_DRIVER: ${BME_CO2_DRIVER:-mhz19}
      BME_CO2_SERIAL_DEVICE: ${BME_CO2_SERIAL_DEVICE:-/dev/ttyAMA0}
      BME_SAMPLE_INTERVAL_S: ${BME_SAMPLE_INTERVAL_S:-10}
      BME_RETENTION_DAYS: ${BME_RETENTION_DAYS:-30}
    # Pass the SPI bus and the CO2 sensor's UART through to the container.
    # Comment out any line whose device doesn't exist on this machine (e.g.
    # when running with the mock drivers, or with BME_CO2_DRIVER=none).
    devices:
      - ${BME_SPI_DEVICE:-/dev/spidev0.0}:${BME_SPI_DEVICE:-/dev/spidev0.0}
      - ${BME_CO2_SERIAL_DEVICE:-/dev/ttyAMA0}:${BME_CO2_SERIAL_DEVICE:-/dev/ttyAMA0}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
